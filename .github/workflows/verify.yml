name: Verify INDEPENDENCE

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python stdlib / finite automata / zero-package policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Python regression suite
        run: python3 -m unittest discover -s tests -v
      - name: Verify and restore the exact historical v1.0.1 browser evidence ZIP
        run: python3 scripts/verify_browser_archive.py --restore "$RUNNER_TEMP/independence-original-browser-evidence.zip"
      - name: Preserve restored original ZIP as a CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: independence-v1.0.1-original-browser-evidence
          path: ${{ runner.temp }}/independence-original-browser-evidence.zip
          if-no-files-found: error
      - name: Check proof contract registry
        run: python3 scripts/check_proof_contracts.py --json
      - name: Check new AUTOMATA4 proof-source and corpus consistency
        run: python3 scripts/check_automata_formal.py --output "$RUNNER_TEMP/automata4-static.json"
      - name: Verify local AUTOMATA4 evidence
        run: python3 scripts/verify_automata_evidence.py "$RUNNER_TEMP/automata4-static.json"
      - name: Optional actual native JavaScript vector and browser-lab checks
        shell: bash
        run: |
          if command -v node >/dev/null 2>&1; then
            node scripts/check_automata_js.mjs
            node --input-type=module -e 'import {runFormalLabSelfTests} from "./formal-lab/tests.js"; const checks = runFormalLabSelfTests(); for (const c of checks) console.log((c.passed ? "PASS " : "FAIL ") + c.name); if (checks.some(c => !c.passed)) process.exit(1);'
          else
            echo "NOT_RUN: Node unavailable; no JS execution evidence claimed."
          fi
      - name: Inspect v1.0.2 Rocq source and independent finite-model bridge (NOT_RUN unless compiled)
        run: python3 scripts/check_rocq_semantics.py --output "$RUNNER_TEMP/rocq-static-evidence.json"
      - name: Preserve Rocq source-level evidence and explicit NOT_RUN status
        uses: actions/upload-artifact@v4
        with:
          name: independence-v1.0.2-rocq-static-evidence
          path: ${{ runner.temp }}/rocq-static-evidence.json
          if-no-files-found: error
      - name: Verify first-party dependency audit
        run: python3 scripts/audit.py --json

      - name: Build exact first-party Pages artifact
        run: python3 scripts/site_bundle.py stage --source . --site "$RUNNER_TEMP/independence-site" --revision "$GITHUB_SHA"
      - name: Independently verify staged source bytes
        run: python3 scripts/site_bundle.py verify --source . --site "$RUNNER_TEMP/independence-site" --revision "$GITHUB_SHA"
      - name: Run real Chromium journeys and controlled ledger failures
        run: python3 scripts/run_browser_journeys.py --site "$RUNNER_TEMP/independence-site" --require-browser --output "$RUNNER_TEMP/real-browser-evidence.json"
      - name: Run real Firefox WebDriver journeys and controlled ledger failures
        run: python3 scripts/firefox_journeys.py --site "$RUNNER_TEMP/independence-site" --require-browser --output "$RUNNER_TEMP/firefox-browser-evidence.json"
      - name: Check narrow 390px responsive viewport in both actual browser engines
        shell: bash
        run: |
          python3 scripts/run_browser_journeys.py --site "$RUNNER_TEMP/independence-site" --width 390 --height 844 --normal-only --require-browser --output "$RUNNER_TEMP/chromium-narrow.json"
          python3 scripts/firefox_journeys.py --site "$RUNNER_TEMP/independence-site" --width 390 --height 844 --normal-only --require-browser --output "$RUNNER_TEMP/firefox-narrow.json"
      - name: Preserve real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independence-real-browser-evidence
          path: |
            ${{ runner.temp }}/real-browser-evidence.json
            ${{ runner.temp }}/firefox-browser-evidence.json
            ${{ runner.temp }}/chromium-narrow.json
            ${{ runner.temp }}/firefox-narrow.json
          if-no-files-found: ignore
