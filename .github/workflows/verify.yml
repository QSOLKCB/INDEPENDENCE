name: Verify INDEPENDENCE

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python stdlib / finite automata / zero-package policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Python regression suite
        run: python3 -m unittest discover -s tests -v
      - name: Check proof contract registry
        run: python3 scripts/check_proof_contracts.py --json
      - name: Check new AUTOMATA4 proof-source and corpus consistency
        run: python3 scripts/check_automata_formal.py --output "$RUNNER_TEMP/automata4-static.json"
      - name: Verify local AUTOMATA4 evidence
        run: python3 scripts/verify_automata_evidence.py "$RUNNER_TEMP/automata4-static.json"
      - name: Optional actual native JavaScript vector and browser-lab checks
        shell: bash
        run: |
          if command -v node >/dev/null 2>&1; then
            node scripts/check_automata_js.mjs
            node --input-type=module -e 'import {runFormalLabSelfTests} from "./formal-lab/tests.js"; const checks = runFormalLabSelfTests(); for (const c of checks) console.log((c.passed ? "PASS " : "FAIL ") + c.name); if (checks.some(c => !c.passed)) process.exit(1);'
          else
            echo "NOT_RUN: Node unavailable; no JS execution evidence claimed."
          fi
      - name: Verify first-party dependency audit
        run: python3 scripts/audit.py --json
