# Manually verify a previous Pages publish without redeploying it.
# The exact manifest is extracted from that run's preserved github-pages artifact.tar.
# Works with historical deployment run 41113714704 too, before the separate
# independent-pages-manifest upload existed.
name: Verify Published INDEPENDENCE Bytes

on:
  workflow_dispatch:
    inputs:
      deployment_run_id:
        description: "Completed Deploy INDEPENDENCE workflow run ID"
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  verify-public:
    name: Observe published HTTPS bytes (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact original GitHub Pages upload from selected deployment
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ inputs.deployment_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published-pages

      - name: Extract only the exact deployment manifest from Pages artifact.tar
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/published-pages/artifact.tar"
          mkdir -p "$RUNNER_TEMP/published-manifest"
          tar -xOf "$RUNNER_TEMP/published-pages/artifact.tar" ./deployment-manifest.json > "$RUNNER_TEMP/published-manifest/deployment-manifest.json"
          test -s "$RUNNER_TEMP/published-manifest/deployment-manifest.json"

      - name: Compare every public byte with preserved deployment manifest
        run: python3 scripts/verify_deployed_site.py --manifest "$RUNNER_TEMP/published-manifest/deployment-manifest.json" --attempts 8 --delay 10 --output "$RUNNER_TEMP/manual-pages-observation.json"

      - name: Preserve success or explicit NOT_VERIFIED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independence-manual-pages-observation
          path: ${{ runner.temp }}/manual-pages-observation.json
          if-no-files-found: ignore
