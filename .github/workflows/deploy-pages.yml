# Manually publish the dependency-free website from main.
# No Node.js/npm build, pip installation, Docker, or Jekyll required.
name: Deploy INDEPENDENCE to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: independence-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and publish static website
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Collect GitHub public evidence snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_ledger.py --output ledger/data.json

      - name: Run Python standard-library tests
        run: python3 -m unittest discover -s tests -v

      - name: Check zero-package web policy
        run: python3 scripts/audit.py --json

      - name: Stage only first-party site files
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/independence-pages"
          mkdir -p "$site/lab" "$site/ledger" "$site/tribunal" "$site/museum" "$site/breeding"
          cp index.html styles.css app.js .nojekyll "$site/"
          cp lab/core.js lab/tests.js "$site/lab/"
          cp ledger/ledger.js ledger/ledger.css ledger/data.json "$site/ledger/"
          cp tribunal/core.js tribunal/direct.js tribunal/keyed.js "$site/tribunal/"
          cp tribunal/bench.js tribunal/ui.js tribunal/tribunal.css "$site/tribunal/"
          cp museum/core.js museum/ui.js museum/museum.css "$site/museum/"
          cp breeding/core.js breeding/ui.js breeding/breeding.css "$site/breeding/"
          test -s "$site/index.html"
          test -s "$site/app.js"
          test -s "$site/lab/core.js"
          test -s "$site/ledger/data.json"
          test -s "$site/tribunal/core.js"
          test -s "$site/tribunal/bench.js"
          test -s "$site/museum/core.js"
          test -s "$site/museum/ui.js"
          test -s "$site/breeding/core.js"
          test -s "$site/breeding/ui.js"
          echo "Static Pages artifact ready; no build required."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/independence-pages

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
