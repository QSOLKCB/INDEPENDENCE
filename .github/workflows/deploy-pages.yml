# Manually publish the dependency-free website from main.
# No Node.js/npm build, pip installation, Docker, or Jekyll required.
name: Deploy INDEPENDENCE to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: independence-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and publish static website
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Collect GitHub public evidence snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_ledger.py --output ledger/data.json

      - name: Run Python standard-library tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate proof obligations (stdlib)
        run: python3 scripts/check_proof_contracts.py --json

      - name: Check zero-package web policy
        run: python3 scripts/audit.py --json


      - name: Stage exact allowlisted Pages artifact and SHA-256 manifest
        run: python3 scripts/site_bundle.py stage --source . --site "$RUNNER_TEMP/independence-pages" --revision "$GITHUB_SHA"

      - name: Verify staged deployment against checkout
        run: python3 scripts/site_bundle.py verify --source . --site "$RUNNER_TEMP/independence-pages" --revision "$GITHUB_SHA"

      - name: Preserve exact deployment manifest for later public observation
        uses: actions/upload-artifact@v4
        with:
          name: independence-pages-manifest
          path: ${{ runner.temp }}/independence-pages/deployment-manifest.json
          if-no-files-found: error

      - name: Execute real browser smoke and ledger fault journeys
        run: python3 scripts/run_browser_journeys.py --site "$RUNNER_TEMP/independence-pages" --require-browser --output "$RUNNER_TEMP/pages-browser-evidence.json"

      - name: Run real Firefox WebDriver journeys before deploying
        run: python3 scripts/firefox_journeys.py --site "$RUNNER_TEMP/independence-pages" --require-browser --output "$RUNNER_TEMP/pages-firefox-evidence.json"

      - name: Verify narrow viewport journeys in both actual browsers
        shell: bash
        run: |
          python3 scripts/run_browser_journeys.py --site "$RUNNER_TEMP/independence-pages" --width 390 --height 844 --normal-only --require-browser --output "$RUNNER_TEMP/pages-chromium-narrow.json"
          python3 scripts/firefox_journeys.py --site "$RUNNER_TEMP/independence-pages" --width 390 --height 844 --normal-only --require-browser --output "$RUNNER_TEMP/pages-firefox-narrow.json"
      - name: Preserve pre-deployment browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: independence-pages-preflight
          path: |
            ${{ runner.temp }}/pages-browser-evidence.json
            ${{ runner.temp }}/pages-firefox-evidence.json
            ${{ runner.temp }}/pages-chromium-narrow.json
            ${{ runner.temp }}/pages-firefox-narrow.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/independence-pages

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      # GitHub reported a successful deployment before we began this separate
      # eventually-consistent public-CDN observation. Do not turn a transient
      # 404 into a false "deployment failed", nor turn a missing match into PASS.
      - name: Observe public GitHub Pages bytes (separate from publishing)
        id: public-observation
        continue-on-error: true
        run: python3 scripts/verify_deployed_site.py --manifest "$RUNNER_TEMP/independence-pages/deployment-manifest.json" --attempts 8 --delay 10 --output "$RUNNER_TEMP/pages-remote-evidence.json"

      - name: Report separate publishing and public-byte observation outcomes
        if: always() && steps.deployment.outcome == 'success'
        shell: bash
        env:
          PUBLIC_OBSERVATION_OUTCOME: ${{ steps.public-observation.outcome }}
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "### GitHub Pages deployment"
            echo "Deployment action: **SUCCESS**"
            echo "Published URL: $PUBLISHED_URL"
            if [[ "$PUBLIC_OBSERVATION_OUTCOME" == "success" ]]; then
              echo "Public HTTP asset observation: **REMOTE_HTTP_ASSETS_MATCHED_MARKER_UNOBSERVED**"
              echo "Note: .nojekyll is required in staged artifact but not remotely byte-observed."
            else
              echo "Public asset observation: **NOT_VERIFIED**"
              echo "This does not roll back the successful publish. Check the observation artifact and run the separate manual verification workflow with this deployment run ID."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PUBLIC_OBSERVATION_OUTCOME" != "success" ]]; then
            echo "::warning::Pages deployment succeeded, but the public byte comparison is NOT_VERIFIED; use the manual follow-up workflow."
          fi

      - name: Preserve public byte-observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independence-pages-public-observation
          path: ${{ runner.temp }}/pages-remote-evidence.json
          if-no-files-found: ignore
